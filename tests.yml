name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install --upgrade pip opencv-python-headless
      - name: Compile Python files
        run: python -m compileall -q main.py mask_detector.py download_model.py evaluate.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
